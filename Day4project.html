<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form</p>
    <hr></hr>
    <form>
        <h2>Personall Details</h2>
        <label for="Name">Name:</label>
        <input type="text" name="Name" id="Name" placeholder="e.g.Max" required>
        <br></br>

        <label for="Last Name">Last Name:</label>
        <input type="text" name="Last Name" id="Last Name" placeholder="e.g.Anderson" required>
        <br></br>
        <label for="Date-of-birth">Date-of-birth:</label>
        <input type="date" name="Date-of-birth" id="Date-of-birth">
        <br></br>
        <h3>Gender</h3>
        <label for="Male">Male</label>
        <input type="radio" name="Gender" id="Male" value="Male">
        <br></br>
        <label for="Female">Female</label>
        <input type="radio" name="Gender" id="Female" value="Female">
        <br></br>
        <label for="Other">Other</label>
        <input type="radio" name="Gender" id="Other" value="Other">
        <br></br>

        <h3>Upload Your photo</h3>
        <input type="file" name="file">
        <br></br>
        <hr>
        <h2>Contact Information</h2>
        <label for="Email Address">Email Address:</label>
        <input type="email" name="Email Address" id="Email Address" placeholder="you@example.com">
        <br></br>
        <label for="Phone Number">Phone Number:</label>
        <input type="tel" name="Phone Number" id="Phone Number" Placeholder="e.g.9876543210">
        <br></br>
        <label fpr="Address">Mailing Address:</label>
        <br>
        <textarea name="Mailing Address" id="Address" placeholder="Street Address , city ,state"  rows="10",cols=20></textarea>

        <hr>
        <h2>Academic Information</h2>
        <label for="course">Select your course</label>
          <select name="course" id="course">
            <option value="CSE">CSE</option>
            <option value="ME">ME</option>
            <option value="CE">CE</option> 
          </select>
          <br>

          <h3>Extracurricular Activities</h3>

          <label for="Sports">Sports</label>
          <input type="checkbox" name="interest" id="Sports" value="Sports">
          <br><br>

          <label for="Music">Music</label>
          <input type="checkbox" name="interest" id="music" value="Music">
          <br><br>

          <label for="Technology">Technology</label>
          <input type="checkbox" name="interest" id="Technology" value="Technology">
          <br><br>

          <label for="Voluntering">Voluntering</label>
          <input type="checkbox" name="interest" id="Voluntering" value="Voluntering">
          <br><br>

          <hr>

          <h2>Create Your Account</h2>
          <label for="pass">Create a Password:</label>
          <input type="password" name="password" id="pass">
          <br><br>

          <label for="Question">Security Question:</label>
          <select name="Question" id="Question">
            <option value="option 1"> what is your pet's name</option>
            <option value="option 2"> what is faviourate sports</option>
            <option value="option 3"> what is your hobby</option>
          </select>
          <br><br>

          <label for="Answer">Security Answer:</label>
          <input type="text" id="Answer" value="Answer">
          <br><br>

          
          <input type="checkbox" name="Terms & Condition" id="Condition" value="I agree to the Terms and Conditions.">
          <label for="Condition">I agree to the Terms and Conditions.</label>
          <hr>

          <button type="submit">Register</button>
          <button type="reset">Clear Form</button>







            
        






    



    </form>

    
</body>
</html>
